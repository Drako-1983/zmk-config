# ──────────────────────────────────────────────────────
#  Corne CRKBD v3.0.1  ·  NRF52840 (nice!nano v2)
#  ZMK Configuration
# ──────────────────────────────────────────────────────

# ── RGB Underglow ─────────────────────────────────────
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
# LED apagado al inicio (se enciende manualmente con RGB_TOG en capa Adjust)
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
# Se apaga automáticamente cuando el teclado entra en modo idle (ahorra batería)
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
# No se apaga al desconectar USB (permite usarlo por BLE sin cable)
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n
# Brillo inicial y máximo (0-100)
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=15
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=25

# ── USB ───────────────────────────────────────────────
# Habilita salida USB HID (necesario para cargar y trabajar con cable)
# Por defecto ZMK envía la salida por USB al conectar el cable.
# Usa OUT_TOG (capa Adjust, tecla H) para seguir escribiendo por BLE mientras carga.
CONFIG_ZMK_USB=y

# ── Pantalla ──────────────────────────────────────────
#
#  OPCIÓN A — OLED SSD1306 (128×32):
#  Descomenta la línea siguiente y compila normalmente.
#
# CONFIG_ZMK_DISPLAY=y
#
#  OPCIÓN B — nice!view (e-paper, menor consumo):
#  1. Descomenta CONFIG_ZMK_DISPLAY=y abajo
#  2. En build.yaml, agrega "nice_view_adapter nice_view" al shield de cada mitad:
#       shield: corne_left nice_view_adapter nice_view
#       shield: corne_right nice_view_adapter nice_view
#
# CONFIG_ZMK_DISPLAY=y
#
#  Widgets disponibles (activos por defecto si CONFIG_ZMK_DISPLAY=y):
#    CONFIG_ZMK_WIDGET_LAYER_STATUS=y   ← capa activa
#    CONFIG_ZMK_WIDGET_BATTERY_STATUS=y ← nivel de batería
#    CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y  ← USB o BLE activo
#    CONFIG_ZMK_WIDGET_WPM_STATUS=y     ← palabras por minuto (desactivado por defecto)
