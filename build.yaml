# ──────────────────────────────────────────────────────
#  build.yaml — Corne CRKBD v3.0.1
#  Board: NRF52840 compatible nice!nano v2
#
#  OPCIÓN ACTIVA: Sin pantalla (solo RGB underglow)
#  Para agregar pantalla ver opciones comentadas abajo.
# ──────────────────────────────────────────────────────
---
include:
  # Mitad izquierda
  - board: nice_nano_v2
    shield: corne_left
  # Mitad derecha
  - board: nice_nano_v2
    shield: corne_right
  # Shield para resetear bonds BT (flashear una sola vez si hay problemas de emparejamiento)
  - board: nice_nano_v2
    shield: settings_reset

# ── OPCIÓN B: OLED SSD1306 ────────────────────────────
# Reemplaza las entradas corne_left/right de arriba por estas:
#
#   - board: nice_nano_v2
#     shield: corne_left
#   - board: nice_nano_v2
#     shield: corne_right
#
# Y descomenta CONFIG_ZMK_DISPLAY=y en corne.conf.
# (El shield corne ya incluye soporte OLED, no requiere shield extra)

# ── OPCIÓN C: nice!view (e-paper, ~1000x menos consumo que OLED) ──────
# Reemplaza las entradas corne_left/right de arriba por estas:
#
#   - board: nice_nano_v2
#     shield: corne_left nice_view_adapter nice_view
#   - board: nice_nano_v2
#     shield: corne_right nice_view_adapter nice_view
#
# Y descomenta CONFIG_ZMK_DISPLAY=y en corne.conf.
# La nice!view requiere el adaptador (nice_view_adapter) porque el Corne
# no tiene el pin CS nativo para la pantalla.
